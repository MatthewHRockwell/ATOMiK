what_does_your_company_do:
  short: "Hardware-accelerated delta-state computing in silicon"
  long: >-
    ATOMiK is a formally verified hardware architecture for delta-state
    computing. Rather than the traditional Load-Modify-Store cycle, ATOMiK
    accumulates state changes via XOR operations. The public proof stack
    separates formal proof artifacts, live hardware prototype artifacts,
    synthesis output, and roadmap work by evidence label.

how_far_along:
  answer: >-
    Working FPGA and live ATOMiK Desk prototype artifacts exist in the repo,
    along with formal proof work, SDK code, hardware-validation notes, and
    evidence labels. Specific performance, test-count, cost, and maturity
    claims should be quoted only with the current artifact link attached.

why_now:
  answer: >-
    CHIPS Act investment in domestic semiconductor R&D, growing demand for
    energy-efficient compute at the edge ($61B -> $232B by 2030), AI
    inference crisis (90% of lifetime cycles are inference, $300B+
    hyperscaler capex), and post-Moore economics making novel architectures
    competitive against brute-force scaling below 3nm.

what_is_the_technical_approach:
  answer: >-
    XOR-based delta accumulation: State = S0 XOR d1 XOR d2 ... XOR dn.
    Commutativity and self-inverse behavior are proof-scoped properties.
    Hardware latency, throughput, power, and area statements require a linked
    hardware or synthesis artifact before external use.

what_is_the_market:
  answer: >-
    State-heavy edge, embedded, distributed sync, and infrastructure teams are
    the evaluation focus. Market sizing and revenue forecasts are projected
    planning inputs, not results, and require founder review before submission.

what_is_the_business_model:
  answer: >-
    ARM-style IP licensing at 90%+ gross margin. Four revenue streams:
    (1) RTL IP licensing to chip designers, (2) vertical hardware modules
    for specific markets, (3) SDK platform subscription, (4) professional
    services for custom integration.

how_is_this_different:
  answer: >-
    ATOMiK treats state change and delta application as compute primitives,
    with proof artifacts, prototype hardware, and SDK work in one public repo.
    Competitor and moat claims require current source checks and evidence
    labels before external use.

what_do_you_need:
  answer: >-
    Design partners, technical advisors, and funding conversations to validate
    real state-heavy workloads, prototype mappings, and evidence packages.
    Delaware C-Corp incorporation remains an operating dependency for many
    funding paths.

team_background:
  answer: >-
    Solo technical founder behind the ATOMiK proof, software, hardware, and
    public-materials work. Specific proof counts, cost figures, and build
    status should be checked against current artifacts before reuse.

what_are_the_risks:
  answer: >-
    Key risks: (1) ASIC tape-out cost and timeline, mitigated by starting
    with FPGA IP licensing; (2) market adoption timing, mitigated by
    multiple beachhead verticals; (3) solo founder, mitigated by
    AI-augmented development and hiring plan; (4) SBIR reauthorisation
    lapse, mitigated by pursuing multiple funding paths simultaneously.
