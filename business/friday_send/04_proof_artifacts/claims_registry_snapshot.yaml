disclaimer: "Live screenshots show current prototypes. Concept visuals show product direction and are not represented as current commercial functionality. Performance claims are only stated when backed by measured artifacts."

evidence_labels:
  LIVE_MEASURED: "Observed on a running system with recorded measurement artifacts."
  HARDWARE_VALIDATED: "Demonstrated on physical hardware, but not necessarily accompanied by full benchmark artifacts."
  SOFTWARE_VALIDATED: "Shown in software prototype, simulation, local runtime, or non-hardware environment."
  FORMAL_PROOF: "A directly audited formal proof artifact or formal statement; use only for the exact property proven."
  SYNTHESIS_VALIDATED: "Validated through synthesis, build, compile, or toolchain output."
  BUILD_ARTIFACT: "Concrete local build outputs exist, but the end-to-end hardware path has not yet been promoted as a live result."
  PROJECTED: "A model, estimate, or expected economic/performance outcome. Must not be phrased as a result."
  CONCEPTUAL: "Used to explain product direction, UX, architecture, or design intent. Not current proof."
  ROADMAP: "Planned work that may change."

