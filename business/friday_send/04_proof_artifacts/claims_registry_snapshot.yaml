  - id: parallel-bank-throughput-ax7020-2026-05-30
    label: LIVE_MEASURED
    claim: "An 8-bank ATOMiK XOR accumulator scaled linearly with allocated banks on the AX7020, measured with an on-chip cycle counter, with a byte-identical result across all bank counts that matched a software recompute."
    artifact: "hardware/zynq/results/PARALLEL_BANKS_HARDWARE_VALIDATED.md"
    date: "2026-05-30"
    public_safe: true
    notes: "1/2/4/8 banks complete the same accumulation in 1/2/4/8x fewer cycles (about 100 to 800 Mdeltas/s at the 100 MHz sys clock). This is the measurement bench engine (0xF0021000), not the production application adapter. Proves the throughput substrate and the order-independent / lock-free / deterministic-latency property; NOT a customer-workload speedup, power, or thermal outcome. Quote figures at 100 MHz."

  - id: zynq-hdmi-1080p30-2026-05-30
    label: HARDWARE_VALIDATED
    claim: "The ATOMiK Desk UI renders at 1080p30 over HDMI on the AX7020."
    artifact: "hardware/zynq/results/HDMI_1080P60_IMPOSSIBLE.md"
    date: "2026-05-30"
    public_safe: true
    notes: "Claim 1080p30 ONLY. 1080p60 is physically impossible on this board (OSERDES2 minimum-pulse-width limit on the 737.5 MHz serializer). Never claim 1080p60. 720p60 is the achievable true-60Hz path. Earlier 1280x720@60Hz figures refer to the Tang Nano, not the AX7020."

  - id: memory-traffic-reduction-software-suite
    label: SOFTWARE_VALIDATED
    claim: "Delta-state execution reduced memory-traffic bytes by orders of magnitude on state-redundant workloads in the software benchmark suite while preserving the final result."
    artifact: "hardware/experiments/analysis/statistics.md"
    date: "2026-01-24"
    public_safe: true
    notes: "Software-harness measurements, NOT hardware. Ratios are workload-dependent and vary widely across the suite and across analysis runs. Do NOT publish a single headline multiplier, and do NOT revive the older 7,670x-916,000x range as a universal or hardware result (it is not reproduced by a current artifact). The board-measured grounding for redundant-work reduction is the AX7020 coalescing path (16x operation reduction, 64 ops to 4)."

  - id: live-workloads-surface-ax7020-2026-06-08
    label: LIVE_MEASURED
    claim: "ATOMiK's Workloads surface (real-time telemetry aggregation) runs on the AX7020 over HDMI showing live measured parallel-bank throughput: 800 Mevents/s at 8 banks, 1/2/4/8 throughput scaling, byte-identical across all bank configurations."
    artifact: "website/public/12-workloads-live-ax7020.png"
    source_artifact: "atomik_os/docs/screenshots/workloads_LIVE_20260607.png"
    related_artifact: "hardware/zynq/results/PARALLEL_BANKS_HARDWARE_VALIDATED.md"
    date: "2026-06-08"
    public_safe: true
    notes: "First customer-facing workload demo proven end-to-end on hardware (parallel-bank engine 0xF0021000, board-side daemon -> /tmp/atomik_bench_live.txt -> surface). SCOPE TIGHTLY: only the throughput figures (800 Mevents/s, 1/2/4/8x, byte-identical) are LIVE_MEASURED. Resource Fabric STATE/SYNC/AGENT/EVENT/VISUAL and top-bar temp/efficiency/predictive values are DERIVED/SCENARIO, not measured customer/power/thermal proof. STATIC capture, not an interactive session; does NOT prove USB input or interactivity (still in-flight). Never say 'live interactive demo' or 'plug in a keyboard'."

