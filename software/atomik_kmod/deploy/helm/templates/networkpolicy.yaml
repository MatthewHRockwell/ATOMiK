apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atomik
  namespace: {{ include "atomik.namespace" . }}
  labels:
    {{- include "atomik.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "atomik.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Allow only Prometheus scrape traffic on the metrics port
    - ports:
        - port: {{ .Values.prometheus.port }}
          protocol: TCP
