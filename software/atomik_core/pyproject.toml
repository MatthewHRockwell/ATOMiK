[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atomik-core"
version = "0.4.0"
description = "ATOMiK delta-state algebra — O(1) state reconstruction for any processor"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    {name = "ATOMiK Project", email = "mrockwell@atomik.tech"}
]
keywords = [
    "state-management",
    "delta-state",
    "xor-algebra",
    "lock-free",
    "distributed-systems",
    "fingerprinting",
    "change-detection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
ws = ["websockets>=12.0"]
redis = ["redis>=5.0"]
fastapi = ["atomik-core"]  # no extra deps needed, it's pure ASGI
sqlalchemy = ["sqlalchemy>=2.0"]
all = ["websockets>=12.0", "redis>=5.0", "sqlalchemy>=2.0"]

[project.scripts]
atomik = "atomik_core.__main__:cli_main"

[project.urls]
Homepage = "https://atomik.tech"
Documentation = "https://atomik.tech/docs"
Repository = "https://github.com/MatthewHRockwell/ATOMiK"
Changelog = "https://github.com/MatthewHRockwell/ATOMiK/releases"
Issues = "https://github.com/MatthewHRockwell/ATOMiK/issues"

[tool.setuptools.packages.find]
include = ["atomik_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
